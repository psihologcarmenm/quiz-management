<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulare Examen</title>

<style>
body{
font-family:Arial;
background:#eef2f7;
padding:20px;
max-width:700px;
margin:auto;
}

h1{
text-align:center;
color:#2563eb;
}

.quiz-box{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
margin-top:20px;
}

.question{
font-size:24px;
margin-bottom:20px;
}

.answer{
display:block;
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:12px;
background:#f1f5f9;
cursor:pointer;
font-size:18px;
transition:0.3s;
}

.answer:hover{
background:#dbeafe;
}

.correct{
background:#22c55e !important;
color:white;
}

.wrong{
background:#ef4444 !important;
color:white;
}

#nextBtn{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:18px;
cursor:pointer;
display:none;
}

#score{
font-size:22px;
text-align:center;
margin-top:20px;
font-weight:bold;
}
</style>
</head>

<body>

<h1>Simulare Examen</h1>

<div class="quiz-box">

<div id="question" class="question"></div>

<div id="answers"></div>

<button id="nextBtn">Întrebarea următoare</button>

<div id="score"></div>

</div>

<script>

const quiz = [

];

let currentQuestion = 0;
let score = 0;

const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const nextBtn = document.getElementById("nextBtn");
const scoreEl = document.getElementById("score");

function showQuestion(){

nextBtn.style.display="none";

const q = quiz[currentQuestion];

questionEl.innerText = (currentQuestion+1)+". "+q.question;

answersEl.innerHTML="";

q.answers.forEach((answer,index)=>{

const btn=document.createElement("button");

btn.innerText=answer;

btn.classList.add("answer");

btn.onclick=()=>selectAnswer(btn,index);

answersEl.appendChild(btn);

});

}

function selectAnswer(button,index){

const correct = quiz[currentQuestion].correct;

const buttons=document.querySelectorAll(".answer");

buttons.forEach(btn=>btn.disabled=true);

if(index===correct){

button.classList.add("correct");

score++;

}else{

button.classList.add("wrong");

buttons[correct].classList.add("correct");

}

nextBtn.style.display="block";

}

nextBtn.onclick=()=>{

currentQuestion++;

if(currentQuestion<quiz.length){

showQuestion();

}else{

showScore();

}

}

function showScore(){

questionEl.innerText="Quiz finalizat!";

answersEl.innerHTML="";

nextBtn.style.display="none";

scoreEl.innerText="Scor final: "+score+" / "+quiz.length;

}

showQuestion();

</script>

</body>
</html>
